# Prometheus scrapes frequently so service replica changes appear quickly in local evidence.
global:
  scrape_interval: 5s

scrape_configs:
  # Docker DNS for a Compose service returns the service replica addresses for individual scraping.
  - job_name: api
    dns_sd_configs:
      - names:
          - api
        type: A
        port: 8080
        refresh_interval: 5s
  # Docker DNS for a Compose service returns the service replica addresses for individual scraping.
  - job_name: worker
    dns_sd_configs:
      - names:
          - worker
        type: A
        port: 9100
        refresh_interval: 5s
