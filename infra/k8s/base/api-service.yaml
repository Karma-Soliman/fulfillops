# Publishes the API through NodePort 30080, mapped to this Mac's localhost:8080 by kind.
apiVersion: v1
kind: Service
metadata:
  name: fulfillops-api
  namespace: fulfillops
  # Identifies the API endpoint.
  labels:
    app.kubernetes.io/component: api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: fulfillops
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
