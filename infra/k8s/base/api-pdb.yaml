# Keeps at least one API replica available during voluntary disruptions.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fulfillops-api
  namespace: fulfillops
  # Identifies this disruption budget as protecting the API component.
  labels:
    app.kubernetes.io/component: api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fulfillops
      app.kubernetes.io/component: api
